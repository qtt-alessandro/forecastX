[project]
name = "fcastx"
version = "0.1.0"
description = "Time-series forecasting toolkit: ensemble ML models, rolling backtests, and conformal prediction intervals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "mlforecast>=0.13.0",
    "plotly>=6.7.0",
    "polars>=1.41.1",
    "pyarrow>=24.0.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.8.0",
    "statsforecast>=2.0.3",
    "statsmodels>=0.14.6",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
neural = ["neuralforecast>=3.2.1,<4", "torch>=2.9.1,<2.10"]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecastx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
