[project]
name = "fcastx"
version = "0.1.0"
description = "Time-series forecasting toolkit: ensemble ML models, rolling backtests, and conformal prediction intervals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "mapie>=0.8.0",
    "matplotlib>=3.10.9",
    "mlforecast>=0.13.0",
    "nbformat>=5.10.4",
    "plotly>=6.7.0",
    "polars>=1.41.1",
    "pyarrow>=24.0.0",
    "requests-cache>=1.3.2",
    "scikit-learn>=1.8.0",
    "statsforecast>=2.0.3",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
